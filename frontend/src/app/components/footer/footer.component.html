<footer class="footer dark-bg">
  <div class="footer-content-wrapper">
    <div class="footer-section">
      <h3>{{ footerContent.company_name }}</h3>
      <p>{{ footerContent.description }}</p>
    </div>

    <div class="footer-section">
      <h4>Liên Hệ</h4>
      <div class="contact-item">
        <mat-icon aria-hidden="true">phone</mat-icon>
        <a [href]="'tel:' + footerContent.phone.replace(' ', '')">{{ footerContent.phone }}</a>
      </div>
      <div class="contact-item">
        <mat-icon aria-hidden="true">email</mat-icon>
        <a [href]="'mailto:' + footerContent.email">{{ footerContent.email }}</a>
      </div>
      <div class="contact-item">
        <mat-icon aria-hidden="true">location_on</mat-icon>
        <span>{{ footerContent.address }}</span>
      </div>
    </div>

    <div class="footer-section">
      <h4>Dịch Vụ</h4>
      <ul class="service-list">
        <li *ngFor="let service of footerContent.services; trackBy: trackByIndex">{{ service }}</li>
      </ul>
    </div>

    <div class="footer-section social-section">
      <h4>Theo Dõi</h4>
      <div class="social-links">
        <a *ngFor="let socialMedia of footerContent.social_media; trackBy: trackBySocialName"
           [href]="socialMedia.url"
           class="social-link"
           target="_blank"
           rel="noopener noreferrer"
           [title]="socialMedia.name"
           [attr.aria-label]="socialMedia.name">
          <mat-icon aria-hidden="true">{{ socialMedia.icon }}</mat-icon>
        </a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="footer-bottom-content">
      <p>{{ footerContent.copyright_text }}</p>
    </div>
  </div>
</footer>
