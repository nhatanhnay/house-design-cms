<div class="consultation-form-section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Đăng ký nhận tư vấn miễn phí</h2>
      <p class="section-subtitle">Để lại thông tin, chúng tôi sẽ liên hệ tư vấn miễn phí cho bạn trong 24h</p>
    </div>

    <form [formGroup]="consultationForm" (ngSubmit)="onSubmit()" class="consultation-form">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Họ và tên <span class="required">*</span></label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="Nhập họ và tên của bạn"
            [class.error]="consultationForm.get('name')?.invalid && consultationForm.get('name')?.touched"
          />
          <div class="error-message" *ngIf="consultationForm.get('name')?.invalid && consultationForm.get('name')?.touched">
            Vui lòng nhập họ và tên
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại <span class="required">*</span></label>
          <input
            type="tel"
            id="phone"
            formControlName="phone"
            placeholder="Nhập số điện thoại"
            [class.error]="consultationForm.get('phone')?.invalid && consultationForm.get('phone')?.touched"
          />
          <div class="error-message" *ngIf="consultationForm.get('phone')?.invalid && consultationForm.get('phone')?.touched">
            <span *ngIf="consultationForm.get('phone')?.errors?.['required']">Vui lòng nhập số điện thoại</span>
            <span *ngIf="consultationForm.get('phone')?.errors?.['pattern']">Số điện thoại không hợp lệ</span>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Nhập địa chỉ email (tùy chọn)"
            [class.error]="consultationForm.get('email')?.invalid && consultationForm.get('email')?.touched"
          />
          <div class="error-message" *ngIf="consultationForm.get('email')?.invalid && consultationForm.get('email')?.touched">
            Email không hợp lệ
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="details">Nội dung cần tư vấn</label>
        <textarea
          id="details"
          formControlName="details"
          rows="4"
          placeholder="Mô tả chi tiết nhu cầu của bạn (diện tích, phong cách, ngân sách...)"
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="consultationForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Gửi thông tin</span>
          <span *ngIf="isSubmitting">Đang gửi...</span>
        </button>
      </div>

      <div class="success-message" *ngIf="submitSuccess">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>Cảm ơn bạn! Chúng tôi sẽ liên hệ với bạn trong thời gian sớm nhất.</span>
      </div>

      <div class="error-alert" *ngIf="submitError">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ submitError }}</span>
      </div>
    </form>
  </div>
</div>
